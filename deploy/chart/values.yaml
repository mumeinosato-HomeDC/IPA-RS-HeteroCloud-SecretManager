openbao:
  global:
    tlsDisable: false
  injector:
    enabled: true
    replicas: 2
    externalBaoAddr: https://secrets.heterocloud.mizuame.app
    agentImage:
      registry: quay.io
      repository: openbao/openbao
      tag: 2.6.3@sha256:a60afafda36337abe833c4a63894bf1095098f29abea4091e7e555a33dd52889
    nodeSelector:
      heteronetwork.io/control-plane-only: 'true'
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: heteronetwork.io/control-plane-only
      operator: Equal
      value: 'true'
      effect: NoSchedule
    - key: heteronetwork.io/control-plane-only
      operator: Equal
      value: 'true'
      effect: NoExecute
    webhook:
      failurePolicy: Fail
      timeoutSeconds: 5
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: heterocloud-flash-workloads
      matchConditions:
      - name: secret-injection-requested
        expression: 'has(object.metadata.annotations) && "vault.hashicorp.com/agent-inject" in object.metadata.annotations'
  csi:
    enabled: false
  server:
    image:
      tag: 2.6.3@sha256:a60afafda36337abe833c4a63894bf1095098f29abea4091e7e555a33dd52889
    logFormat: json
    updateStrategyType: OnDelete
    podManagementPolicy: Parallel
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: '2'
        memory: 2Gi
    nodeSelector:
      heteronetwork.io/control-plane-only: 'true'
    tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: heteronetwork.io/control-plane-only
      operator: Equal
      value: 'true'
      effect: NoSchedule
    - key: heteronetwork.io/control-plane-only
      operator: Equal
      value: 'true'
      effect: NoExecute
    serviceAccount:
      name: openbao
      serviceDiscovery:
        enabled: true
    service:
      active:
        enabled: true
      standby:
        enabled: false
    networkPolicy:
      enabled: false
    extraVolumes:
    - type: secret
      name: openbao-server-tls
    dataStorage:
      enabled: true
      size: 20Gi
      storageClass: openbao-local
      accessMode: ReadWriteOnce
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    statefulSet:
      securityContext:
        pod:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
    ha:
      enabled: true
      replicas: 3
      apiAddr: https://$(BAO_K8S_POD_NAME).openbao-internal.openbao.svc.cluster.local:8200
      disruptionBudget:
        enabled: true
        maxUnavailable: 1
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = false

          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file = "/openbao/userconfig/openbao-server-tls/tls.crt"
            tls_key_file = "/openbao/userconfig/openbao-server-tls/tls.key"
            tls_min_version = "tls12"
          }

          storage "raft" {
            path = "/openbao/data"
            retry_join {
              leader_api_addr = "https://openbao-0.openbao-internal.openbao.svc.cluster.local:8200"
              leader_tls_servername = "openbao-0.openbao-internal.openbao.svc.cluster.local"
              leader_ca_cert_file = "/openbao/userconfig/openbao-server-tls/ca.crt"
            }
            retry_join {
              leader_api_addr = "https://openbao-1.openbao-internal.openbao.svc.cluster.local:8200"
              leader_tls_servername = "openbao-1.openbao-internal.openbao.svc.cluster.local"
              leader_ca_cert_file = "/openbao/userconfig/openbao-server-tls/ca.crt"
            }
            retry_join {
              leader_api_addr = "https://openbao-2.openbao-internal.openbao.svc.cluster.local:8200"
              leader_tls_servername = "openbao-2.openbao-internal.openbao.svc.cluster.local"
              leader_ca_cert_file = "/openbao/userconfig/openbao-server-tls/ca.crt"
            }
          }

          service_registration "kubernetes" {}

          audit "file" "stdout" {
            description = "Cluster audit trail"
            options {
              file_path = "stdout"
              log_raw = "false"
            }
          }

namespace:
  create: true

pki:
  # Set to false to supply the openbao-server-tls Secret (tls.crt, tls.key,
  # ca.crt) yourself instead of using cert-manager.
  certManager:
    enabled: true

storage:
  # Disable to use a dynamic StorageClass instead of the pinned local PVs.
  localPersistentVolumes:
    enabled: true

vpn:
  enabled: true
  parentRef:
    name: openbao-vpn
    namespace: openbao
    sectionName: http
  backend:
    # envoyBackend uses the Envoy Gateway Backend CRD; service uses a plain
    # Service backendRef plus a BackendTLSPolicy.
    mode: envoyBackend
    caConfigMapName: ""
  hostname: secrets.heterocloud.mizuame.app
  internalHostname: secrets.heteronetwork.internal

backup:
  enabled: true
  schedule: '17 2 * * *'
  image: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-secretmanager-snapshot@sha256:3d18a109c9ac64e6b3977dfa7d4911a34734ae3e46bfa3ab39aa2514a6a9059c
  recipient: age1tvt46eh35h6wnm76ldtedldtm2x36pqufehtd4pqgkc80tvvlpqs8qg86s
  storageClassName: longhorn
  size: 20Gi
